[project]
name = "analysis-pipeline-builder"
version = "0.1.0.dev0"
description = "Potato Pipeline: graphical pipeline builder for structural analysis, from Nastran results to Word report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "nicegui>=4.0.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "typer>=0.29.1",
]

[project.scripts]
apb = "apb.cli:app"

[project.entry-points."apb.blocks"]
# Third-party block packages register here too, e.g. fasteners = "fastener_blocks:BLOCKS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "ANN", "SIM", "RUF", "PTH"]
ignore = ["D105", "D107", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "playwright>=1.65.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-openpyxl>=3.1.5.20261017",
]
